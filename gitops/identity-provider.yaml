apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:    
    - name: github
      mappingMethod: claim
      type: GitHub
      github:
        clientID: 8b29ff426b3974a1919c
        clientSecret:
          name: github-client-secret
        hostname: ""
        organizations:
          - ocp4-marco
        teams: []
    - name: devspaces      # The name users will see on the login screen
      mappingMethod: claim
      type: HTPasswd
      htpasswd:
        fileData:
          name: htpasswd-secret   # Must match the Secret name