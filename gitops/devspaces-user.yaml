kind: User
apiVersion: user.openshift.io/v1
metadata:
  name: developer1
fullName: Devspaces User
groups: []
---
apiVersion: user.openshift.io/v1
kind: Group
metadata:
  name: devspaces-users
users:
  - developer1
---
